[env:lolin32]
; Using the pioarduino platform fork instead of the official PlatformIO
; registry "espressif32" package: the registry version is stuck on an old
; Arduino-ESP32 core (old toolchain, old I2S driver) despite its version
; label. pioarduino tracks the real, current Arduino-ESP32 core.
platform = https://github.com/pioarduino/platform-espressif32.git
board = lolin32
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = custom_no_ota.csv  ; <--- Points to your new 2.44MB storage split!
build_flags = -D CORE_DEBUG_LEVEL=0

lib_deps =
    https://github.com/schreibfaul1/ESP32-audioI2S.git#3.0.0 ; <--- Pinned: newer versions require PSRAM, which the Lolin32 doesn't have
    https://github.com/tzapu/WiFiManager.git            ; <--- Added for Wi-Fi portal
    https://github.com/mathieucarbou/ESPAsyncWebServer.git ; <--- Added for non-blocking web server
